<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubeon - Staff Panel</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: #090b11; color: white; min-height: 100vh; overflow-x: hidden; }

        /* FONDO ANIMADO DE TRIÁNGULOS */
        .bg-animation {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background: #090b11; overflow: hidden;
        }
        .bg-animation::before, .bg-animation::after {
            content: ''; position: absolute; width: 150vmax; height: 150vmax;
            top: -25vmax; left: -25vmax; opacity: 0.15;
            background-image: 
                linear-gradient(30deg, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%),
                linear-gradient(150deg, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%),
                linear-gradient(270deg, transparent 45%, currentColor 45%, currentColor 55%, transparent 55%);
            background-size: 300px 300px;
            animation: swim 20s linear infinite;
        }
        .bg-animation::after {
            transform: scale(1.5) rotate(45deg);
            animation: swim 30s linear infinite reverse;
            opacity: 0.08;
        }
        @keyframes swim {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-300px) rotate(15deg); }
        }

        /* COLORES DE FONDO */
        .login-container .bg-animation { color: #a855f7; }
        .dashboard-container .bg-animation { color: #3b82f6; }

        /* LOGIN */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; position: relative; }
        .login-box { background: rgba(18, 18, 25, .85); border: 1px solid rgba(168, 85, 247, .3); border-radius: 24px; padding: 50px 40px; width: 100%; max-width: 420px; text-align: center; backdrop-filter: blur(20px); box-shadow: 0 20px 60px rgba(0,0,0,0.8); animation: slideUp 0.6s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        
        .login-box h1 { margin-bottom: 30px; font-weight: 900; font-size: 28px; letter-spacing: 1px; }
        .login-box form { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 16px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(0,0,0,0.5); color: white; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: #a855f7; box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); }
        button { padding: 16px; border-radius: 12px; border: none; background: #7e22ce; color: white; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #9333ea; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(126, 34, 206, 0.3); }

        /* DASHBOARD */
        .dashboard-container { position: relative; padding: 30px; max-width: 1600px; margin: 0 auto; display: none; animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px; }
        .top-nav h1 { font-size: 24px; font-weight: 800; }
        .top-nav button { background: rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 10px 20px; border: 1px solid rgba(239, 68, 68, 0.5); font-size: 14px; }
        .top-nav button:hover { background: #ef4444; color: white; }

        /* 4 COLUMNAS */
        .columns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .column { background: rgba(18, 18, 25, .7); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 16px; padding: 20px; min-height: 600px; backdrop-filter: blur(10px); }
        .column h2 { font-size: 15px; margin-bottom: 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; color: #d1d5db; text-transform: uppercase; letter-spacing: 1px; }
        
        .task-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; padding: 18px; margin-bottom: 15px; transition: 0.3s; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        .task-card:hover { background: rgba(255, 255, 255, 0.05); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        
        .task-card h4 { font-size: 15px; margin-bottom: 8px; color: #fff; }
        .task-card p { font-size: 13px; color: #9ca3af; margin-bottom: 12px; line-height: 1.4; }
        .task-card small { display: block; font-size: 11px; color: #60a5fa; margin-bottom: 5px; background: rgba(59, 130, 246, 0.1); padding: 4px 8px; border-radius: 4px; width: fit-content; }
        
        .task-images { display: flex; gap: 5px; margin-bottom: 15px; }
        .task-images img { width: 50px; height: 50px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .task-images img:hover { transform: scale(1.1); }

        .task-actions { display: flex; gap: 8px; margin-top: 15px; }
        .task-actions button { padding: 10px; font-size: 12px; flex: 1; border-radius: 8px; }
        .btn-danger { background: #dc2626; color: white; }
        .btn-danger:hover { background: #ef4444; }
        .btn-blue { background: #2563eb; }
        .btn-blue:hover { background: #3b82f6; }

        /* CHAT FLOTANTE PROFESIONAL */
        #chat-toggle { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: #3b82f6; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4); z-index: 1000; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #chat-toggle:hover { transform: scale(1.1) translateY(-5px); background: #2563eb; box-shadow: 0 15px 35px rgba(59, 130, 246, 0.6); }
        #chat-toggle svg { width: 28px; height: 28px; fill: white; }

        #chat-container { position: fixed; bottom: 100px; right: 30px; width: 360px; height: 500px; background: #0f172a; border: 1px solid rgba(59, 130, 246, 0.3); border-radius: 16px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 20px 50px rgba(0,0,0,0.8); overflow: hidden; animation: slideUpChat 0.3s ease-out; }
        @keyframes slideUpChat { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        .chat-header { background: #1e293b; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(59, 130, 246, 0.2); }
        .chat-header h3 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        .chat-header h3::before { content: ''; display: block; width: 8px; height: 8px; background: #22c55e; border-radius: 50%; }
        .chat-header span { cursor: pointer; font-size: 24px; line-height: 1; color: #94a3b8; transition: 0.2s; }
        .chat-header span:hover { color: white; }
        
        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: #090b11; }
        .chat-bubble { max-width: 80%; padding: 12px 16px; border-radius: 12px; font-size: 13px; line-height: 1.5; position: relative; animation: popIn 0.2s ease-out; word-wrap: break-word; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .chat-bubble.me { background: #2563eb; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-bubble.other { background: #1e293b; color: #e2e8f0; align-self: flex-start; border-bottom-left-radius: 2px; }
        .chat-author { font-size: 10px; color: #94a3b8; margin-bottom: 4px; display: block; }
        .chat-bubble.me .chat-author { text-align: right; }

        .chat-input-area { display: flex; padding: 15px; background: #1e293b; border-top: 1px solid rgba(59, 130, 246, 0.2); gap: 10px; }
        #chat-input { flex: 1; padding: 12px 15px; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); background: #090b11; color: white; outline: none; font-size: 13px; }
        #chat-input:focus { border-color: #3b82f6; }
        #chat-send { padding: 0 20px; border-radius: 20px; background: #3b82f6; border: none; color: white; cursor: pointer; font-weight: 600; transition: 0.2s; }
        #chat-send:hover { background: #2563eb; }

        @media(max-width: 1024px) { .columns { grid-template-columns: 1fr 1fr; } }
        @media(max-width: 600px) { .columns { grid-template-columns: 1fr; } #chat-container { width: 100%; height: 100%; bottom: 0; right: 0; border-radius: 0; } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4fJNlncjWova31Ecf2tc6TZABdMGj5hQ",
            authDomain: "kubeon-jobs-4f3ff.firebaseapp.com",
            projectId: "kubeon-jobs-4f3ff",
            storageBucket: "kubeon-jobs-4f3ff.firebasestorage.app",
            messagingSenderId: "632091924063",
            appId: "1:632091924063:web:c7ed07dc89a57083376dea"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isAdmin = false;

        const loginForm = document.getElementById('login-form');
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Credenciales incorrectas. Verifica tu correo y contraseña.");
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.style.display = "none";
                dashboardScreen.style.display = "block";

                const q = query(collection(db, "usuarios"), where("email", "==", user.email));
                const querySnapshot = await getDocs(q);
                isAdmin = false;
                querySnapshot.forEach((doc) => {
                    if (doc.data().rol === "admin") isAdmin = true;
                });

                document.querySelectorAll('.admin-only').forEach(el => {
                    el.style.display = isAdmin ? "block" : "none";
                });

                cargarTareasTiempoReal();
                iniciarChat();

            } else {
                currentUser = null;
                dashboardScreen.style.display = "none";
                loginScreen.style.display = "flex";
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        function cargarTareasTiempoReal() {
            const q = query(collection(db, "tareas"));
            onSnapshot(q, (snapshot) => {
                const cSolicitudes = document.getElementById('solicitudes-tasks');
                const cPendientes = document.getElementById('pending-tasks');
                const cAceptados = document.getElementById('accepted-tasks');
                const cTerminados = document.getElementById('completed-tasks');
                
                cSolicitudes.innerHTML = ''; cPendientes.innerHTML = ''; cAceptados.innerHTML = ''; cTerminados.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const tarea = docSnap.data();
                    const id = docSnap.id;
                    
                    if (!isAdmin && tarea.estado !== 'solicitud' && tarea.asignadoA !== currentUser.email) return;

                    let imagenesHTML = '';
                    if (tarea.imagenes && tarea.imagenes.length > 0) {
                        imagenesHTML = `<div class="task-images">`;
                        tarea.imagenes.forEach(url => {
                            imagenesHTML += `<a href="${url}" target="_blank"><img src="${url}"></a>`;
                        });
                        imagenesHTML += `</div>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'task-card';
                    
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <h4>${tarea.titulo}</h4>
                            ${tarea.precio ? `<span style="color:#60a5fa; font-weight:bold;">${tarea.precio}</span>` : ''}
                        </div>
                        <p>${tarea.descripcion}</p>
                        ${tarea.contacto ? `<small>Contacto: ${tarea.contacto}</small>` : ''}
                        ${imagenesHTML}
                        <small>Staff: ${tarea.asignadoA}</small>
                        <div class="task-actions">
                            ${tarea.estado === 'solicitud' ? `<button onclick="aceptarSolicitud('${id}')" class="btn-blue">Tomar Solicitud</button>` : ''}
                            ${tarea.estado === 'pendiente' && (tarea.asignadoA === currentUser.email || isAdmin) ? `<button onclick="cambiarEstado('${id}', 'aceptado')">Empezar</button>` : ''}
                            ${tarea.estado === 'aceptado' ? `<button onclick="cambiarEstado('${id}', 'terminado')">Terminar</button>` : ''}
                            ${isAdmin ? `<button class="btn-danger" onclick="borrarTarea('${id}')">X</button>` : ''}
                        </div>
                    `;

                    if (tarea.estado === 'solicitud') cSolicitudes.appendChild(card);
                    if (tarea.estado === 'pendiente') cPendientes.appendChild(card);
                    if (tarea.estado === 'aceptado') cAceptados.appendChild(card);
                    if (tarea.estado === 'terminado') cTerminados.appendChild(card);
                });
            });
        }

        window.aceptarSolicitud = async (id) => {
            if (!confirm("¿Estás seguro de tomar esta solicitud? Te la asignarás a ti mismo.")) return;
            try {
                const tareaRef = doc(db, "tareas", id);
                await updateDoc(tareaRef, { asignadoA: currentUser.email, estado: "pendiente" });
            } catch (e) { alert("Error al tomar solicitud."); }
        };

        window.cambiarEstado = async (id, nuevoEstado) => {
            try {
                const tareaRef = doc(db, "tareas", id);
                await updateDoc(tareaRef, { estado: nuevoEstado });
            } catch (e) { alert("Error al actualizar."); }
        };

        window.borrarTarea = async (id) => {
            if (!isAdmin) return;
            if (!confirm("¿Seguro que quieres eliminar esta tarea?")) return;
            try {
                await deleteDoc(doc(db, "tareas", id));
            } catch (e) { alert("Error al borrar."); }
        };

        let unsubscribeChat = null;

        function iniciarChat() {
            const chatBox = document.getElementById('chat-messages');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send');

            const q = query(collection(db, "chat_staff"), orderBy("timestamp", "asc"), limit(50));
            
            if(unsubscribeChat) unsubscribeChat();
            
            unsubscribeChat = onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = msg.email === currentUser.email;
                    const authorName = isMe ? 'Tú' : msg.email.split('@')[0];
                    
                    chatBox.innerHTML += `
                        <div class="chat-bubble ${isMe ? 'me' : 'other'}">
                            ${!isMe ? `<span class="chat-author">${authorName}</span>` : ''}
                            ${msg.texto}
                        </div>
                    `;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            sendBtn.onclick = async () => {
                const texto = chatInput.value.trim();
                if (!texto) return;
                chatInput.value = '';
                try {
                    await addDoc(collection(db, "chat_staff"), {
                        texto: texto, email: currentUser.email, timestamp: new Date()
                    });
                } catch (e) { alert("Error al enviar mensaje."); }
            };

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendBtn.click();
            });
        }

        document.getElementById('chat-toggle').addEventListener('click', () => {
            const container = document.getElementById('chat-container');
            container.style.display = container.style.display === 'none' ? 'flex' : 'none';
        });
        document.getElementById('chat-close').addEventListener('click', () => {
            document.getElementById('chat-container').style.display = 'none';
        });
    </script>
</head>
<body>

    <!-- PANTALLA DE LOGIN -->
    <div id="login-screen" class="login-container">
        <div class="bg-animation"></div>
        <div class="login-box">
            <h1>KUBEON STAFF</h1>
            <form id="login-form">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <!-- PANEL DE TRABAJO -->
    <div id="dashboard" class="dashboard-container">
        <div class="bg-animation"></div>
        
        <div class="top-nav">
            <h1>Panel de Staff</h1>
            <button id="logout-btn">Cerrar Sesión</button>
        </div>

        <div class="columns">
            <div class="column">
                <h2 style="color: #60a5fa;">Solicitudes Nuevas</h2>
                <div id="solicitudes-tasks"></div>
            </div>
            <div class="column">
                <h2>Pendientes</h2>
                <div id="pending-tasks"></div>
            </div>
            <div class="column">
                <h2>Aceptados</h2>
                <div id="accepted-tasks"></div>
            </div>
            <div class="column admin-only" style="display: none;">
                <h2>Terminados / Logs</h2>
                <div id="completed-tasks"></div>
            </div>
        </div>
    </div>

    <!-- CHAT FLOTANTE -->
    <div id="chat-toggle">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
    </div>

    <div id="chat-container">
        <div class="chat-header">
            <h3>Chat de Staff</h3>
            <span id="chat-close">×</span>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe un mensaje...">
            <button id="chat-send">Enviar</button>
        </div>
    </div>

</body>
</html>
