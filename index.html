<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubeon - Staff Panel</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background: #090b11; color: white; min-height: 100vh; }
        
        /* LOGIN */
        .login-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: radial-gradient(circle at top left, rgba(126,34,206,0.15), transparent 50%); }
        .login-box { background: rgba(18, 18, 25, .92); border: 1px solid rgba(168, 85, 247, .3); border-radius: 20px; padding: 40px; width: 100%; max-width: 400px; text-align: center; backdrop-filter: blur(10px); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        .login-box h1 { margin-bottom: 20px; font-weight: 900; }
        .login-box form { display: flex; flex-direction: column; gap: 15px; }
        input { padding: 15px; border-radius: 10px; border: 1px solid rgba(168, 85, 247, 0.3); background: rgba(0,0,0,0.5); color: white; font-size: 16px; outline: none; transition: 0.3s; }
        input:focus { border-color: #a855f7; }
        button { padding: 15px; border-radius: 10px; border: none; background: #7e22ce; color: white; font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #9333ea; transform: scale(1.02); }

        /* DASHBOARD */
        .dashboard-container { padding: 30px; max-width: 1600px; margin: 0 auto; display: none; }
        .top-nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(168, 85, 247, 0.2); padding-bottom: 20px; }
        
        /* 4 COLUMNAS */
        .columns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
        .column { background: rgba(18, 18, 25, .6); border: 1px solid rgba(168, 85, 247, 0.15); border-radius: 16px; padding: 15px; min-height: 500px; }
        .column h2 { font-size: 16px; margin-bottom: 15px; border-bottom: 1px solid rgba(168, 85, 247, 0.2); padding-bottom: 10px; color: #d1d5db; }
        
        .task-card { background: rgba(168, 85, 247, 0.05); border: 1px solid rgba(168, 85, 247, 0.3); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .task-card h4 { font-size: 15px; margin-bottom: 8px; color: #fff; }
        .task-card p { font-size: 13px; color: #9ca3af; margin-bottom: 10px; }
        .task-card small { display: block; font-size: 11px; color: #a855f7; margin-bottom: 5px; }
        .task-actions { display: flex; gap: 8px; margin-top: 10px; }
        .task-actions button { padding: 8px; font-size: 12px; flex: 1; }
        .btn-danger { background: #dc2626; }

        /* CHAT FLOTANTE */
        #chat-toggle { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 50%; background: #7e22ce; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(126, 34, 206, 0.5); z-index: 1000; transition: 0.3s; }
        #chat-toggle:hover { transform: scale(1.1); background: #9333ea; }
        #chat-toggle svg { width: 30px; height: 30px; fill: white; }

        #chat-container { position: fixed; bottom: 100px; right: 30px; width: 350px; height: 450px; background: #151122; border: 1px solid #a855f7; border-radius: 16px; display: none; flex-direction: column; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.8); overflow: hidden; }
        .chat-header { background: #7e22ce; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; }
        .chat-header span { cursor: pointer; font-size: 20px; line-height: 1; }
        #chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid rgba(168, 85, 247, 0.2); }
        #chat-input { flex: 1; padding: 10px; border-radius: 8px 0 0 8px; border: 1px solid rgba(168, 85, 247, 0.3); background: #090b11; color: white; outline: none; }
        #chat-send { padding: 10px 15px; border-radius: 0 8px 8px 0; background: #7e22ce; border: none; color: white; cursor: pointer; }

        @media(max-width: 1024px) { .columns { grid-template-columns: 1fr 1fr; } }
        @media(max-width: 600px) { .columns { grid-template-columns: 1fr; } #chat-container { width: 90%; right: 5%; } }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, onSnapshot, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4fJNlncjWova31Ecf2tc6TZABdMGj5hQ",
            authDomain: "kubeon-jobs-4f3ff.firebaseapp.com",
            projectId: "kubeon-jobs-4f3ff",
            storageBucket: "kubeon-jobs-4f3ff.firebasestorage.app",
            messagingSenderId: "632091924063",
            appId: "1:632091924063:web:c7ed07dc89a57083376dea"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isAdmin = false;

        const loginForm = document.getElementById('login-form');
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) {
                alert("Credenciales incorrectas. Verifica tu correo y contraseña.");
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.style.display = "none";
                dashboardScreen.style.display = "block";

                const q = query(collection(db, "usuarios"), where("email", "==", user.email));
                const querySnapshot = await getDocs(q);
                isAdmin = false;
                querySnapshot.forEach((doc) => {
                    if (doc.data().rol === "admin") isAdmin = true;
                });

                document.querySelectorAll('.admin-only').forEach(el => {
                    el.style.display = isAdmin ? "block" : "none";
                });

                cargarTareasTiempoReal();
                iniciarChat();

            } else {
                currentUser = null;
                dashboardScreen.style.display = "none";
                loginScreen.style.display = "flex";
            }
        });

        document.getElementById('logout-btn').addEventListener('click', () => {
            signOut(auth);
        });

        function cargarTareasTiempoReal() {
            const q = query(collection(db, "tareas"));
            
            onSnapshot(q, (snapshot) => {
                const cSolicitudes = document.getElementById('solicitudes-tasks');
                const cPendientes = document.getElementById('pending-tasks');
                const cAceptados = document.getElementById('accepted-tasks');
                const cTerminados = document.getElementById('completed-tasks');
                
                cSolicitudes.innerHTML = ''; cPendientes.innerHTML = ''; cAceptados.innerHTML = ''; cTerminados.innerHTML = '';

                snapshot.forEach((docSnap) => {
                    const tarea = docSnap.data();
                    const id = docSnap.id;
                    
                    if (!isAdmin && tarea.estado !== 'solicitud' && tarea.asignadoA !== currentUser.email) return;

                    const card = document.createElement('div');
                    card.className = 'task-card';
                    
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:start;">
                            <h4>${tarea.titulo}</h4>
                            ${tarea.precio ? `<span style="color:#a855f7; font-weight:bold;">${tarea.precio}</span>` : ''}
                        </div>
                        <p>${tarea.descripcion}</p>
                        ${tarea.contacto ? `<small style="color:#3b82f6;">Contacto: ${tarea.contacto}</small>` : ''}
                        <small>Staff: ${tarea.asignadoA}</small>
                        <div class="task-actions">
                            ${tarea.estado === 'solicitud' ? `<button onclick="aceptarSolicitud('${id}')" style="background:#2563eb;">Tomar Solicitud</button>` : ''}
                            ${tarea.estado === 'pendiente' && (tarea.asignadoA === currentUser.email || isAdmin) ? `<button onclick="cambiarEstado('${id}', 'aceptado')">Empezar</button>` : ''}
                            ${tarea.estado === 'aceptado' ? `<button onclick="cambiarEstado('${id}', 'terminado')">Terminar</button>` : ''}
                            ${isAdmin ? `<button class="btn-danger" onclick="borrarTarea('${id}')">X</button>` : ''}
                        </div>
                    `;

                    if (tarea.estado === 'solicitud') cSolicitudes.appendChild(card);
                    if (tarea.estado === 'pendiente') cPendientes.appendChild(card);
                    if (tarea.estado === 'aceptado') cAceptados.appendChild(card);
                    if (tarea.estado === 'terminado') cTerminados.appendChild(card);
                });
            });
        }

        window.aceptarSolicitud = async (id) => {
            if (!confirm("¿Estás seguro de tomar esta solicitud? Te la asignarás a ti mismo.")) return;
            try {
                const tareaRef = doc(db, "tareas", id);
                await updateDoc(tareaRef, { asignadoA: currentUser.email, estado: "pendiente" });
            } catch (e) { alert("Error al tomar solicitud."); }
        };

        window.cambiarEstado = async (id, nuevoEstado) => {
            try {
                const tareaRef = doc(db, "tareas", id);
                await updateDoc(tareaRef, { estado: nuevoEstado });
            } catch (e) { alert("Error al actualizar."); }
        };

        window.borrarTarea = async (id) => {
            if (!isAdmin) return;
            if (!confirm("¿Seguro que quieres eliminar esta tarea?")) return;
            try {
                await deleteDoc(doc(db, "tareas", id));
            } catch (e) { alert("Error al borrar."); }
        };

        let unsubscribeChat = null;

        function iniciarChat() {
            const chatBox = document.getElementById('chat-messages');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('chat-send');

            const q = query(collection(db, "chat_staff"), orderBy("timestamp", "asc"), limit(50));
            
            if(unsubscribeChat) unsubscribeChat();
            
            unsubscribeChat = onSnapshot(q, (snapshot) => {
                chatBox.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const msg = docSnap.data();
                    const isMe = msg.email === currentUser.email;
                    
                    chatBox.innerHTML += `
                        <div style="margin-bottom: 10px; text-align: ${isMe ? 'right' : 'left'};">
                            <span style="font-size: 11px; color: #9ca3af; display: block;">${isMe ? 'Tú' : msg.email.split('@')[0]}</span>
                            <div style="display: inline-block; background: ${isMe ? '#7e22ce' : '#374151'}; padding: 8px 12px; border-radius: 8px; max-width: 80%; text-align: left; word-break: break-word;">
                                ${msg.texto}
                            </div>
                        </div>
                    `;
                });
                chatBox.scrollTop = chatBox.scrollHeight;
            });

            sendBtn.onclick = async () => {
                const texto = chatInput.value.trim();
                if (!texto) return;
                chatInput.value = '';
                try {
                    await addDoc(collection(db, "chat_staff"), {
                        texto: texto, email: currentUser.email, timestamp: new Date()
                    });
                } catch (e) { alert("Error al enviar mensaje."); }
            };

            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendBtn.click();
            });
        }

        document.getElementById('chat-toggle').addEventListener('click', () => {
            const container = document.getElementById('chat-container');
            container.style.display = container.style.display === 'none' ? 'flex' : 'none';
        });
        document.getElementById('chat-close').addEventListener('click', () => {
            document.getElementById('chat-container').style.display = 'none';
        });
    </script>
</head>
<body>

    <div id="login-screen" class="login-container">
        <div class="login-box">
            <h1>Kubeon Staff</h1>
            <form id="login-form">
                <input type="email" id="email" placeholder="Correo electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <div id="dashboard" class="dashboard-container">
        <div class="top-nav">
            <h1>Panel de Staff</h1>
            <button id="logout-btn" style="background: #4b5563; padding: 10px 20px; font-size: 14px;">Cerrar Sesión</button>
        </div>

        <div class="columns">
            <div class="column">
                <h2 style="color: #3b82f6;">Solicitudes Nuevas</h2>
                <div id="solicitudes-tasks"></div>
            </div>
            <div class="column">
                <h2>Pendientes</h2>
                <div id="pending-tasks"></div>
            </div>
            <div class="column">
                <h2>Aceptados</h2>
                <div id="accepted-tasks"></div>
            </div>
            <div class="column admin-only" style="display: none;">
                <h2>Terminados / Logs</h2>
                <div id="completed-tasks"></div>
            </div>
        </div>
    </div>

    <div id="chat-toggle">
        <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
    </div>

    <div id="chat-container">
        <div class="chat-header">
            Chat de Staff
            <span id="chat-close">×</span>
        </div>
        <div id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe un mensaje...">
            <button id="chat-send">Enviar</button>
        </div>
    </div>

</body>
</html>
