<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubeon - Panel de Staff</title>
    
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, where, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB4fJNlncjWova31Ecf2tc6TZABdMGj5hQ",
            authDomain: "kubeon-jobs-4f3ff.firebaseapp.com",
            projectId: "kubeon-jobs-4f3ff",
            storageBucket: "kubeon-jobs-4f3ff.firebasestorage.app",
            messagingSenderId: "632091924063",
            appId: "1:632091924063:web:c7ed07dc89a57083376dea",
            measurementId: "G-SYHKLH3TGN"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let isAdmin = false;
        let currentUserName = "";

        // Elementos del DOM
        const loginForm = document.getElementById('login-form');
        const loginScreen = document.getElementById('login-screen');
        const dashboardScreen = document.getElementById('dashboard');
        const registerForm = document.getElementById('register-form');
        const loginTitle = document.getElementById('login-title');

        // --- LOGICA DE LOGIN (IGUAL QUE ANTES PERO MEJORADA) ---
        async function checkInitialUser() {
            const usersRef = collection(db, "usuarios");
            const snapshot = await getDocs(usersRef);
            if (snapshot.empty) {
                loginTitle.innerText = "Crear cuenta de Dueño";
                loginForm.style.display = "none";
                registerForm.style.display = "flex";
            }
        }
        checkInitialUser();

        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await addDoc(collection(db, "usuarios"), { email: email, rol: "admin" });
                alert("¡Cuenta de Dueño creada con éxito!");
            } catch (error) { alert("Error: " + error.message); }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch (error) { alert("Credenciales incorrectas."); }
        });

        document.getElementById('logout-btn').addEventListener('click', () => { signOut(auth); });

        // --- DETECTAR SESIÓN ---
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                loginScreen.style.display = "none";
                dashboardScreen.style.display = "block";

                // Obtener nombre y rol
                const q = query(collection(db, "usuarios"), where("email", "==", user.email));
                const querySnapshot = await getDocs(q);
                isAdmin = false;
                currentUserName = user.email.split('@')[0];
                
                querySnapshot.forEach((doc) => {
                    if (doc.data().rol === "admin") isAdmin = true;
                    if(doc.data().nombre) currentUserName = doc.data().nombre;
                });

                document.querySelectorAll('.admin-only').forEach(el => {
                    el.style.display = isAdmin ? "block" : "none";
                });

                cargarTareas();
                iniciarChat();

            } else {
                currentUser = null;
                dashboardScreen.style.display = "none";
                loginScreen.style.display = "flex";
            }
        });

        // --- LOGICA DE TAREAS ---
        window.crearTarea = async () => {
            if (!isAdmin) return alert("No tienes permisos.");
            const titulo = prompt("Título de la tarea:");
            if (!titulo) return;
            const desc = prompt("Descripción:");
            if (!desc) return;
            const asignado = prompt("Email del trabajador:");
            if (!asignado) return;

            await addDoc(collection(db, "tareas"), {
                titulo: titulo, descripcion: desc, asignadoA: asignado, estado: "pendiente", fecha: new Date()
            });
            cargarTareas();
        };

        async function cargarTareas() {
            const contenedorPendientes = document.getElementById('pending-tasks');
            const contenedorAceptados = document.getElementById('accepted-tasks');
            const contenedorTerminados = document.getElementById('completed-tasks');
            
            contenedorPendientes.innerHTML = ''; contenedorAceptados.innerHTML = ''; contenedorTerminados.innerHTML = '';

            const querySnapshot = await getDocs(collection(db, "tareas"));
            
            querySnapshot.forEach((docSnap) => {
                const tarea = docSnap.data();
                const id = docSnap.id;
                
                // Si es trabajador, solo ve las tareas que le asignaron O las que no tienen asignar (para tomar)
                if (!isAdmin && tarea.asignadoA !== currentUser.email && tarea.asignadoA !== "Sin asignar") return;

                const card = document.createElement('div');
                card.className = 'task-card';
                
                // Determinamos las acciones segun el estado y si es staff
                let actionsHTML = '';
                if (tarea.estado === 'pendiente') {
                    if (tarea.asignadoA === "Sin asignar") {
                        actionsHTML = `<button onclick="tomarTarea('${id}')">Tomar Tarea</button>`;
                    } else if (tarea.asignadoA === currentUser.email) {
                        actionsHTML = `<button onclick="cambiarEstado('${id}', 'aceptado')">Aceptar</button>`;
                    }
                } else if (tarea.estado === 'aceptado') {
                    actionsHTML = `<button onclick="cambiarEstado('${id}', 'terminado')">Terminar</button>`;
                }
                
                if (isAdmin) {
                    actionsHTML += `<button class="btn-danger" onclick="borrarTarea('${id}')">Eliminar</button>`;
                }

                // Datos extra si vienen de la web de servicios
                let clienteInfo = tarea.clienteDiscord ? `<span class="badge badge-client">Cliente: ${tarea.clienteDiscord}</span>` : '';
                let precioInfo = tarea.precio ? `<span class="badge badge-price">${tarea.precio}</span>` : '';

                card.innerHTML = `
                    <div class="task-header">
                        <h4>${tarea.titulo}</h4>
                        ${precioInfo}
                    </div>
                    <p>${tarea.descripcion}</p>
                    <div class="task-meta">
                        ${clienteInfo}
                        <span class="badge badge-assign">Asignado a: ${tarea.asignadoA}</span>
                    </div>
                    <div class="task-actions">${actionsHTML}</div>
                `;

                if (tarea.estado === 'pendiente') contenedorPendientes.appendChild(card);
                if (tarea.estado === 'aceptado') contenedorAceptados.appendChild(card);
                if (tarea.estado === 'terminado') contenedorTerminados.appendChild(card);
            });
        }

        window.tomarTarea = async (id) => {
            await updateDoc(doc(db, "tareas", id), { asignadoA: currentUser.email });
            cargarTareas();
        };

        window.cambiarEstado = async (id, nuevoEstado) => {
            await updateDoc(doc(db, "tareas", id), { estado: nuevoEstado });
            cargarTareas();
        };

        window.borrarTarea = async (id) => {
            if (!isAdmin) return;
            if (confirm("¿Eliminar tarea?")) {
                await deleteDoc(doc(db, "tareas", id));
                cargarTareas();
            }
        };

        // --- LOGICA DEL CHAT ---
        function iniciarChat() {
            const chatContainer = document.getElementById('chat-messages');
            const chatForm = document.getElementById('chat-form');
            
            // Escuchar mensajes en tiempo real
            const q = query(collection(db, "chat_staff"), orderBy("fecha", "asc"));
            onSnapshot(q, (snapshot) => {
                chatContainer.innerHTML = '';
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const div = document.createElement('div');
                    div.className = msg.autor === currentUserName ? 'msg msg-own' : 'msg';
                    div.innerHTML = `<strong>${msg.autor}:</strong> <br> ${msg.texto}`;
                    chatContainer.appendChild(div);
                });
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });

            // Enviar mensaje
            chatForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const input = document.getElementById('chat-input');
                if (!input.value.trim()) return;
                
                await addDoc(collection(db, "chat_staff"), {
                    autor: currentUserName,
                    texto: input.value,
                    fecha: new Date()
                });
                input.value = '';
            });
        }

        // Abrir/Cerrar ventana de chat
        window.toggleChat = () => {
            const chatWindow = document.getElementById('chat-window');
            chatWindow.style.display = chatWindow.style.display === 'flex' ? 'none' : 'flex';
        };

    </script>
